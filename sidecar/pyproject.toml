[project]
name = "context-sidecar"
version = "0.1.0"
description = "Local analysis and arrangement sidecar for the Context Max for Live device"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Context" }]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
